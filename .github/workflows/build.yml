name: Build XCamera APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Siapkan NDK + CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Unduh ncnn (Vulkan, Android)
        run: |
          curl -fsSL -o ncnn.zip https://github.com/Tencent/ncnn/releases/download/20240820/ncnn-20240820-android-vulkan.zip
          unzip -q ncnn.zip -d app/src/main/cpp
          ls app/src/main/cpp/ncnn-20240820-android-vulkan

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: XCamera-debug
          path: app/build/outputs/apk/debug/*.apk
